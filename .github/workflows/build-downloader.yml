name: Build and push model-downloader image

on:
  push:
    branches: [main]
    paths:
      - "downloader/**"
      - ".github/workflows/build-downloader.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: downloader
          platforms: linux/amd64
          push: true
          # The sha tag lets the endpoint be pointed at a new build; ":latest" alone doesn't roll workers.
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/model-downloader:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/model-downloader:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

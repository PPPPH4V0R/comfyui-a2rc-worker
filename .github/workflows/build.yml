name: Build and push ComfyUI worker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          load: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/comfyui-a2rc:v1
            ghcr.io/${{ steps.vars.outputs.owner }}/comfyui-a2rc:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Diagnose InstantCharacter import
        if: always()
        run: |
          {
            echo '## InstantCharacter import diagnostic'
            echo '```'
            docker run --rm --entrypoint /opt/venv/bin/python \
              ghcr.io/${{ steps.vars.outputs.owner }}/comfyui-a2rc:sha-${{ github.sha }} \
              /comfyui/custom_nodes/ComfyUI-InstantCharacter/check_import.py 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

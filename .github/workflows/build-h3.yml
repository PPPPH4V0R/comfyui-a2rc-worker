name: Build and push the MiniMax H3 worker image

# Same Dockerfile as build.yml, but with a CUDA 13 torch so comfy-kitchen's
# fast int8 kernels load. Only the H3 endpoint in Canada (CUDA 13 hosts) uses
# this image; every other endpoint stays on the cu126 build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "downloader/**"
      - ".github/workflows/build-downloader.yml"
      - "asmr/**"
      - ".github/workflows/build-asmr.yml"
      - ".github/workflows/build.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            TORCH_CUDA=cu130
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/comfyui-a2rc:h3-sha-${{ github.sha }}
          # Own cache scope, so the two builds don't keep evicting each other's layers.
          cache-from: type=gha,scope=h3
          cache-to: type=gha,scope=h3,mode=max

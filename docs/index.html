<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyUI 工作流</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 1.3rem; }
  .row { margin: 18px 0; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  select, textarea, input[type=number] { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem; border-radius: 6px; border: 1px solid #999; }
  textarea { min-height: 70px; resize: vertical; }
  .seed-row { display: flex; gap: 8px; align-items: center; }
  .seed-row input { flex: 1; }
  button { padding: 12px 20px; font-size: 1rem; cursor: pointer; border-radius: 6px; border: 1px solid #999; }
  #submit { width: 100%; font-weight: 600; }
  #submit:disabled { opacity: .5; }
  .drop { border: 2px dashed #888; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; margin-bottom: 8px; }
  .preview { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
  #imageSlots { display: flex; flex-direction: column; gap: 16px; }
  .imageSlot label { font-weight: 600; }
  #result img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
  #status { margin-top: 14px; font-size: .95rem; color: #888; white-space: pre-line; }
  #result { margin-top: 20px; }
  #result a { display: inline-block; margin-top: 8px; }
  .error { color: #d33; }
  .hint { font-size: .8rem; color: #999; margin-top: 20px; }
  #paintTool { display: none; margin-top: 10px; }
  #paintCanvas { max-width: 100%; touch-action: none; border-radius: 8px; border: 1px solid #999; display: block; }
  .paint-controls { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .paint-controls button { padding: 8px 14px; font-size: .9rem; }
  .paint-hint { font-size: .8rem; color: #999; margin-top: 6px; }
</style>
</head>
<body>
<h1>ComfyUI 工作流</h1>

<div class="row">
  <label>选择工作流</label>
  <select id="workflowSelect"></select>
</div>

<div class="row" id="imageSlots"></div>

<div class="row">
  <label>提示词</label>
  <textarea id="prompt"></textarea>
</div>

<div class="row">
  <label>随机种子</label>
  <div class="seed-row">
    <input type="number" id="seed">
    <button type="button" id="randomSeed">🎲 随机</button>
  </div>
</div>

<div class="row">
  <button id="submit" disabled>开始生成</button>
</div>

<div id="status"></div>
<div id="result"></div>

function randomSeed() {
  return Math.floor(Math.random() * 1e15);
}

function updateSubmitEnabled() {
  const wf = WORKFLOWS[selectEl.value];
  if (wf.paint) {
    submitEl.disabled = !paintedBlob;
  } else {
    submitEl.disabled = uploadedFiles.length < wf.images || uploadedFiles.slice(0, wf.images).some(f => !f);
  }
}

function renderWorkflowUI() {
  const wf = WORKFLOWS[selectEl.value];
  promptEl.value = wf.defaultPrompt || '';
  seedEl.value = randomSeed();
  uploadedFiles = new Array(wf.images).fill(null);
  paintedBlob = null;
  imageSlotsEl.innerHTML = '';
  resultEl.innerHTML = '';
  statusEl.textContent = '';

  for (let i = 0; i < wf.images; i++) {
    const slot = document.createElement('div');
    slot.className = 'imageSlot';
    const label = document.createElement('label');
    label.textContent = (wf.imageLabels && wf.imageLabels[i]) || ('图片 ' + (i + 1));
    const drop = document.createElement('div');
    drop.className = 'drop';
    drop.textContent = '点击选择图片（拍照或相册）';
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.style.display = 'none';
    const preview = document.createElement('img');
    preview.className = 'preview';

    drop.onclick = () => fileInput.click();
    fileInput.onchange = () => {
      if (!fileInput.files.length) return;
      const f = fileInput.files[0];
      uploadedFiles[i] = f;
      preview.src = URL.createObjectURL(f);
      preview.style.display = 'block';
      if (wf.paint && i === 0) setupPaintTool(f);
      updateSubmitEnabled();
    };

    slot.append(label, drop, fileInput, preview);
    imageSlotsEl.appendChild(slot);
  }

  if (wf.paint) {
    const paintDiv = document.createElement('div');
    paintDiv.id = 'paintTool';
    paintDiv.innerHTML = `
      <canvas id="paintCanvas"></canvas>
      <div class="paint-controls">
        <button type="button" id="paintClear">清除涂色</button>
        <label style="font-weight:normal;display:flex;align-items:center;gap:6px;">
          画笔粗细 <input type="range" id="brushSize" min="10" max="120" value="40" style="width:120px">
        </label>
      </div>
      <p class="paint-hint">用手指/鼠标在要移除或替换的区域涂蓝色，然后在下面提示词里描述"移除蓝色区域后要变成什么"。</p>
    `;
    imageSlotsEl.appendChild(paintDiv);
  }

  updateSubmitEnabled();
}

let paintCtx, paintDrawing = false, paintScale = 1;

function setupPaintTool(file) {
  const toolEl = document.getElementById('paintTool');
  const canvas = document.getElementById('paintCanvas');
  toolEl.style.display = 'block';

  const img = new Image();
  img.onload = () => {
    const maxW = Math.min(window.innerWidth - 40, 600);
    paintScale = Math.min(1, maxW / img.width);
    canvas.width = img.width * paintScale;
    canvas.height = img.height * paintScale;
    paintCtx = canvas.getContext('2d');
    paintCtx.drawImage(img, 0, 0, canvas.width, canvas.height);
    paintedBlob = null;
    updateSubmitEnabled();
  };
  img.src = URL.createObjectURL(file);

  const brushSizeEl = document.getElementById('brushSize');

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function paintAt(x, y) {
    paintCtx.fillStyle = 'rgb(0,0,255)';
    paintCtx.beginPath();
    paintCtx.arc(x, y, Number(brushSizeEl.value) / 2, 0, Math.PI * 2);
    paintCtx.fill();
  }
  function start(e) {
    e.preventDefault();
    paintDrawing = true;
    const p = pos(e);
    paintAt(p.x, p.y);
  }
  function move(e) {
    if (!paintDrawing) return;
    e.preventDefault();
    const p = pos(e);
    paintAt(p.x, p.y);
  }
  function end() {
    if (!paintDrawing) return;
    paintDrawing = false;
    canvas.toBlob(b => { paintedBlob = b; updateSubmitEnabled(); }, 'image/png');
  }
  canvas.onmousedown = start;
  canvas.onmousemove = move;
  window.addEventListener('mouseup', end);
  canvas.ontouchstart = start;
  canvas.ontouchmove = move;
  canvas.ontouchend = end;

  document.getElementById('paintClear').onclick = () => {
    paintCtx.drawImage(img, 0, 0, canvas.width, canvas.height);
    paintedBlob = null;
    updateSubmitEnabled();
  };
}

selectEl.onchange = renderWorkflowUI;
selectEl.value = 'qwen_edit';
renderWorkflowUI();

document.getElementById('randomSeed').onclick = () => { seedEl.value = randomSeed(); };

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

submitEl.onclick = async () => {
  const wfId = selectEl.value;
  const wfDef = WORKFLOWS[wfId];
  submitEl.disabled = true;
  resultEl.innerHTML = '';
  statusEl.textContent = '编码图片中…';

  let images = [];
  let imageNames = [];
  try {
    if (wfDef.paint) {
      const b64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(paintedBlob);
      });
      images.push({ name: 'input.png', image: b64 });
      imageNames.push('input.png');
    } else {
      for (let i = 0; i < wfDef.images; i++) {
        const name = i === 0 ? 'input.png' : 'input_' + i + '.png';
        const b64 = await fileToBase64(uploadedFiles[i]);
        images.push({ name, image: b64 });
        imageNames.push(name);
      }
    }
  } catch (e) {
    statusEl.innerHTML = '<span class="error">读取图片失败: ' + e.message + '</span>';
    submitEl.disabled = false;
    return;
  }

  const workflow = JSON.parse(JSON.stringify(TEMPLATES[wfId]));
  const seed = parseInt(seedEl.value, 10) || randomSeed();
  wfDef.apply(workflow, { prompt: promptEl.value, seed, imageNames });

  const payload = { input: { workflow, images } };
  const headers = { "Content-Type": "application/json" };

  statusEl.textContent = '提交任务中…';
  let jobId;
  try {
    const r = await fetch(API_BASE + "/run", { method: "POST", headers, body: JSON.stringify(payload) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    jobId = data.id;
  } catch (e) {
    statusEl.innerHTML = '<span class="error">提交失败: ' + e.message + '</span>';
    submitEl.disabled = false;
    return;
  }

  statusEl.textContent = '排队/冷启动中，第一次调用可能要 1-2 分钟…';
  const poll = async () => {
    let data;
    try {
      const r = await fetch(API_BASE + "/status/" + jobId, { headers });
      data = await r.json();
    } catch (e) {
      statusEl.textContent = '网络波动，继续重试…';
      setTimeout(poll, 4000);
      return;
    }
    if (data.status === 'COMPLETED') {
      const img = (data.output && data.output.images && data.output.images[0]);
      if (!img) {
        statusEl.innerHTML = '<span class="error">完成但没有返回图片</span>';
        submitEl.disabled = false;
        return;
      }
      statusEl.textContent = '完成！';
      const dataUrl = 'data:image/png;base64,' + img.data;
      resultEl.innerHTML = '<img src="' + dataUrl + '"><br><a href="' + dataUrl + '" download="result.png">下载结果</a>';
      submitEl.disabled = false;
    } else if (data.status === 'FAILED' || data.status === 'CANCELLED' || data.status === 'TIMED_OUT') {
      statusEl.innerHTML = '<span class="error">失败: ' + (data.error || data.status) + '</span>';
      submitEl.disabled = false;
    } else {
      statusEl.textContent = '状态: ' + data.status + ' …';
      setTimeout(poll, 3000);
    }
  };
  poll();
};
</script>
</body>
